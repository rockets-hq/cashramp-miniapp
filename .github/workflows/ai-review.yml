name: AI Review
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to review
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  statuses: write
  actions: write

jobs:
  review:
    uses: rockets-hq/accrue-api/.github/workflows/ai-review.yml@main
    with:
      pr_number: ${{ inputs.pr_number }}
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      AI_REVIEW_TOOLS_DEPLOY_KEY: ${{ secrets.AI_REVIEW_TOOLS_DEPLOY_KEY }}
